<div
  class="photo-gallery"
  [class.photo-gallery--fullscreen]="isFullscreen()"
  [attr.role]="isFullscreen() ? 'dialog' : null"
  [attr.aria-modal]="isFullscreen() ? 'true' : null"
  (click)="onBackdropClick($event)"
>
  <div class="photo-gallery__viewer">
    <div
      class="photo-gallery__track"
      [style.transform]="trackTransform()"
      [style.transition]="trackTransition()"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointercancel)="onPointerUp()"
    >
      @for (photo of photos(); track photo + '' + $index; let i = $index) {
        <div class="photo-gallery__slide">
          @if (!isFailed(i)) {
            <img class="photo-gallery__image" [src]="photo" [alt]="alt()" draggable="false" (error)="onImageError(i)" />
          } @else {
            <div class="photo-gallery__image photo-gallery__image--placeholder" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 10c0-1 1-2 2-2s2 1 2 2M16 10c0-1 1-2 2-2s2 1 2 2M8 15c1.5 1.5 6.5 1.5 8 0" />
              </svg>
            </div>
          }
        </div>
      }
      @if (!hasPhotos()) {
        <div class="photo-gallery__slide">
          <div class="photo-gallery__image photo-gallery__image--placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 10c0-1 1-2 2-2s2 1 2 2M16 10c0-1 1-2 2-2s2 1 2 2M8 15c1.5 1.5 6.5 1.5 8 0" />
            </svg>
          </div>
        </div>
      }
    </div>

    @if (canGoPrevious()) {
      <button
        type="button"
        class="photo-gallery__nav photo-gallery__nav--prev"
        aria-label="Предыдущее фото"
        (click)="previous()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    }

    @if (canGoNext()) {
      <button
        type="button"
        class="photo-gallery__nav photo-gallery__nav--next"
        aria-label="Следующее фото"
        (click)="next()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    }

    @if (hasPhotos()) {
      <button
        type="button"
        class="photo-gallery__expand"
        [attr.aria-label]="isFullscreen() ? 'Закрыть полноэкранный режим' : 'Открыть на весь экран'"
        (click)="toggleFullscreen()"
      >
        @if (isFullscreen()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M21 8V5a2 2 0 0 0-2-2h-3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 21h3a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
      </button>
    }
  </div>

  @if (hasMultiplePhotos()) {
    <div class="photo-gallery__thumbs" role="tablist" aria-label="Выбор фото">
      @for (photo of photos(); track photo + '' + $index; let i = $index) {
        <button
          type="button"
          class="photo-gallery__thumb"
          role="tab"
          [attr.aria-selected]="i === activeIndex()"
          [class.photo-gallery__thumb--active]="i === activeIndex()"
          (click)="selectIndex(i)"
        >
          @if (!isFailed(i)) {
            <img [src]="photo" [alt]="alt() + ' — фото ' + (i + 1)" (error)="onImageError(i)" />
          }
        </button>
      }
    </div>
  }
</div>
