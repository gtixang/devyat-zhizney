<header class="site-header">
  <a class="site-header__brand" routerLink="/">
    <img class="site-header__logo" src="/logo/logo-mark--ink.png" alt="Логотип «Девять жизней»" />
    Девять жизней
  </a>

  <nav class="site-header__nav">
    <a class="nav-link" routerLink="/animals" routerLinkActive="nav-link--active">Животные</a>
    <a class="nav-link" routerLink="/help" routerLinkActive="nav-link--active">Помочь</a>
    <a class="nav-link" routerLink="/volunteers" routerLinkActive="nav-link--active">Волонтёрам</a>
    <a class="nav-link" routerLink="/about" routerLinkActive="nav-link--active">О нас</a>
  </nav>

  <div class="site-header__actions">
    <div class="site-header__contacts">
      <a class="site-header__contact-link" [href]="vkUrl" target="_blank" rel="noopener" title="Наша группа ВКонтакте">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="m9.489.004.729-.003h3.564l.73.003.914.01.433.007.418.011.403.014.388.016.374.021.36.025.345.03.333.033c1.74.196 2.933.616 3.833 1.516.9.9 1.32 2.092 1.516 3.833l.034.333.029.346.025.36.02.373.025.588.012.41.013.644.009.915.004.98-.001 3.313-.003.73-.01.914-.007.433-.011.418-.014.403-.016.388-.021.374-.025.36-.03.345-.033.333c-.196 1.74-.616 2.933-1.516 3.833-.9.9-2.092 1.32-3.833 1.516l-.333.034-.346.029-.36.025-.373.02-.588.025-.41.012-.644.013-.915.009-.98.004-3.313-.001-.73-.003-.914-.01-.433-.007-.418-.011-.403-.014-.388-.016-.374-.021-.36-.025-.345-.03-.333-.033c-1.74-.196-2.933-.616-3.833-1.516-.9-.9-1.32-2.092-1.516-3.833l-.034-.333-.029-.346-.025-.36-.02-.373-.025-.588-.012-.41-.013-.644-.009-.915-.004-.98.001-3.313.003-.73.01-.914.007-.433.011-.418.014-.403.016-.388.021-.374.025-.36.03-.345.033-.333c.196-1.74.616-2.933 1.516-3.833.9-.9 2.092-1.32 3.833-1.516l.333-.034.346-.029.36-.025.373-.02.588-.025.41-.012.644-.013.915-.009ZM6.79 7.3H4.05c.13 6.24 3.25 9.99 8.72 9.99h.31v-3.57c2.01.2 3.53 1.67 4.14 3.57h2.84c-.78-2.84-2.83-4.41-4.11-5.01 1.28-.74 3.08-2.54 3.51-4.98h-2.58c-.56 1.98-2.22 3.78-3.8 3.95V7.3H10.5v6.92c-1.6-.4-3.62-2.34-3.71-6.92Z"
          />
        </svg>
        <span>Наша группа ВКонтакте</span>
      </a>
      <a class="site-header__contact-link" [href]="'tel:' + phoneRaw" title="Позвонить куратору">{{ phoneDisplay }}</a>
    </div>
    <app-button variant="accent" size="sm" link="/help">Поддержать</app-button>
    <button
      type="button"
      class="site-header__burger"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobileMenu"
      (click)="onToggleMobileMenu()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </div>

  @if (isMobileMenuOpen()) {
    <nav class="mobile-menu" id="mobileMenu">
      <a class="mobile-menu__link" routerLink="/animals" (click)="onCloseMobileMenu()">Животные</a>
      <a class="mobile-menu__link" routerLink="/help" (click)="onCloseMobileMenu()">Помочь</a>
      <a class="mobile-menu__link" routerLink="/volunteers" (click)="onCloseMobileMenu()">Волонтёрам</a>
      <a class="mobile-menu__link" routerLink="/about" (click)="onCloseMobileMenu()">О нас</a>
      <a class="mobile-menu__link" [href]="vkUrl" target="_blank" rel="noopener">Мы ВКонтакте</a>
      <a class="mobile-menu__link" [href]="'tel:' + phoneRaw">Позвонить: {{ phoneDisplay }}</a>
    </nav>
  }
</header>
